<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <title>Imprimantă multifuncțională Deli M3100ADNW</title>
    <!-- Common meta price used by our fallback parser -->
    <meta property="product:price:amount" content="999.99" />
    <!-- Also include structured data similar to what many shops expose -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Deli M3100ADNW",
        "offers": {
          "@type": "AggregateOffer",
          "lowPrice": "899,90",
          "highPrice": "1099.90",
          "priceCurrency": "RON"
        }
      }
    </script>
  </head>
  <body>
    <div class="product-page">
      <div class="price-box">
        <span class="price">Pret: 1.099,90 lei</span>
      </div>
    </div>
  </body>
</html>
