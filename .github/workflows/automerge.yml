name: automerge

# Merges a PR labelled `automerge` once Argus and Mentor are clean and every check passed: the
# job and the script live in terrabit-solutions/ci-agents. `wip`, `needs-pacioli` and
# `no-merge` stop it.
#
# On 20.0 it only looks when a label is added: GitHub fires `workflow_run` from the default
# branch alone, so the caller on 19.0 looks again after each workflow of a PR to 20.0 ends.
# A `labeled` event reads the workflow file of the PR's base branch: this one.
on:
  pull_request:
    types: [labeled]
    branches:
      - "20.0"

permissions:
  contents: read

jobs:
  automerge:
    uses: terrabit-solutions/ci-agents/.github/workflows/automerge.yml@main
    with:
      # Outside the organization: GitHub-hosted runners, not the org's VPS ones.
      runs-on: '"ubuntu-latest"'
    # By name: `secrets: inherit` only works inside the organization.
    secrets:
      ARGUS_APP_ID: ${{ secrets.ARGUS_APP_ID }}
      ARGUS_APP_PRIVATE_KEY: ${{ secrets.ARGUS_APP_PRIVATE_KEY }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
