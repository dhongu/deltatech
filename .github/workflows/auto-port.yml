name: Auto Port 17.0 to 18.0

on:
  pull_request:
    types: [closed]
    branches:
      - 17.0

concurrency:
  group: auto-port-${{ github.base_ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_cherry_pick:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config user.name "GitHub Actions Bot (Porting)"
          git config user.email "actions-bot@users.noreply.github.com"

      - name: Determine Target Branch
        id: determine_branch
        run: |
          if [ "${{ github.base_ref }}" = "17.0" ]; then
            echo "target_branch=18.0" >> "$GITHUB_OUTPUT"
            echo "base_branch=17.0" >> "$GITHUB_OUTPUT"
          else
            echo "target_branch=" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping porting, base branch ${{ github.base_ref }} is not configured as source."
          fi

      - name: Ensure target branch exists locally
        if: steps.determine_branch.outputs.target_branch != ''
        env:
          TARGET_BRANCH: ${{ steps.determine_branch.outputs.target_branch }}
        run: |
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" > /dev/null; then
            git fetch origin "$TARGET_BRANCH":"$TARGET_BRANCH"
          else
            echo "::warning::Target branch $TARGET_BRANCH does not exist on remote. Skipping."
            exit 78
          fi

      - name: Compute commits to cherry-pick
        id: pr_commits
        if: steps.determine_branch.outputs.target_branch != ''
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          COMMITS=$(gh pr view "$PR_NUMBER" --json commits -q '.commits[].oid' | tr '\n' ' ' || true)
          if [ -n "$COMMITS" ]; then
            echo "list=$COMMITS" >> "$GITHUB_OUTPUT"
          else
            COMMIT_HASH=$(jq -r '.pull_request.merge_commit_sha' "$GITHUB_EVENT_PATH")
            echo "list=$COMMIT_HASH" >> "$GITHUB_OUTPUT"
          fi

      - name: Attempt Cherry-Pick on Target Branch
        id: cherry_pick
        if: steps.determine_branch.outputs.target_branch != ''
        env:
          TARGET_BRANCH: ${{ steps.determine_branch.outputs.target_branch }}
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          CLEAN_NAME=$(echo "${SOURCE_BRANCH}" | sed 's#[^a-zA-Z0-9._-]#-#g')
          PORT_BRANCH="${TARGET_BRANCH}-port-${CLEAN_NAME}"

          echo "Creating port branch: $PORT_BRANCH"
          git checkout -b "$PORT_BRANCH" "$TARGET_BRANCH"

          STATUS=success
          echo "Attempting cherry-pick of commits onto $TARGET_BRANCH: ${{ steps.pr_commits.outputs.list }}"

          for C in ${{ steps.pr_commits.outputs.list }}; do
            if [ -z "$C" ] || ! git cat-file -e "$C^{commit}" 2>/dev/null; then
              echo "::warning::Skipping invalid commit id: $C"
              continue
            fi
            PARENTS=$(git show -s --format=%P "$C" | wc -w)
            if [ "$PARENTS" -ge 2 ]; then
              echo "Cherry-picking merge commit $C with -m 1"
              if ! git cherry-pick -m 1 "$C"; then
                STATUS=conflict
                break
              fi
            else
              echo "Cherry-picking commit $C"
              if ! git cherry-pick "$C"; then
                STATUS=conflict
                break
              fi
            fi
          done

          if [ "$STATUS" = "success" ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "port_branch=$PORT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            git cherry-pick --abort || true
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "::error::Conflict detected during cherry-pick on $TARGET_BRANCH. Manual porting required."
            echo "::notice file=.github/workflows/auto-port.yml::Conflict: Manual porting required on $TARGET_BRANCH"
          fi

      - name: Push Branch and Create PR (On Success)
        if: steps.cherry_pick.outputs.status == 'success'
        env:
          BASE_BRANCH: ${{ steps.determine_branch.outputs.base_branch }}
          TARGET_BRANCH: ${{ steps.determine_branch.outputs.target_branch }}
          PORT_BRANCH: ${{ steps.cherry_pick.outputs.port_branch }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git push origin "$PORT_BRANCH"

          BODY=$(printf "Automat portat din PR #%s fuzionat în %s.\n\nNOTĂ: PR creat automat; necesită review și testare.\n" "${{ github.event.pull_request.number }}" "$BASE_BRANCH")

          gh pr create --base "$TARGET_BRANCH" --head "$PORT_BRANCH" \
             --title "Porting: $PR_TITLE (from $BASE_BRANCH)" \
             --body "$BODY"

          echo "::notice title=Auto Port::$PR_TITLE portat din $BASE_BRANCH către $TARGET_BRANCH"
