name: tests

on:
  pull_request:
    branches:
      - "18.0*"
  push:
    branches:
      - "18.0"


jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.10-odoo18.0:latest
            name: test with Odoo
    services:
      postgres:
        image: postgres:12.0
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine changed addons
        id: changed
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No usable base commit, running the full test suite."
            echo "addons=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          FULL_RUN=0
          ADDONS=""
          for f in $CHANGED_FILES; do
            dir="${f%%/*}"
            if [ "$dir" = "$f" ] || [[ "$dir" == .* ]]; then
              # Changed file at repo root (requirements.txt, setup.cfg, ...) or under a
              # dotdir (.github, ...): can affect the whole repo, fall back to a full run.
              FULL_RUN=1
              break
            fi
            if [ ! -f "$dir/__manifest__.py" ]; then
              # Changed path is not inside a recognizable addon, play it safe.
              FULL_RUN=1
              break
            fi
            case ",$ADDONS," in
              *,"$dir",*) ;;
              *) ADDONS="${ADDONS:+$ADDONS,}$dir" ;;
            esac
          done

          if [ "$FULL_RUN" = "1" ]; then
            echo "Change outside a single addon detected, running the full test suite."
            echo "addons=" >> "$GITHUB_OUTPUT"
          else
            echo "Changed addons: $ADDONS"
            echo "addons=$ADDONS" >> "$GITHUB_OUTPUT"
          fi
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta

      - name: Install requirements
        run: |
          pip install -r requirements.txt

      - name: Initialize test db
        env:
          INCLUDE: ${{ steps.changed.outputs.addons }}
        run: oca_init_test_database

      - name: Run tests and generate coverage report
        # You may need to adjust 'oca_run_tests' or the preceding commands
        # to ensure it generates a file like coverage.xml
        env:
          INCLUDE: ${{ steps.changed.outputs.addons }}
        run: oca_run_tests

      - name: Upload code coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4  # <-- New action to upload coverage file
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # The action will automatically search for common coverage files (e.g., coverage.xml)

      - name: Upload test results to Codecov (Pass/Fail)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


