ignore:
  - "**/tests/**"
  - "**/migrations/**"
  - "**/__manifest__.py"

coverage:
  status:
    project:
      default:
        target: 70%
        threshold: 1%
    patch:
      default:
        target: 10%
        threshold: 1%

# One flag per CI shard: a shard that fails or skips the upload keeps its last
# coverage instead of dropping its addons from the report.
flag_management:
  default_rules:
    carryforward: true
